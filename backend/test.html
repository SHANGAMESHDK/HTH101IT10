<!DOCTYPE html>
<html>
<head>
  <title>Test Car Detection API</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #0f172a; color: white; }
    .card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; max-width: 500px; margin: 0 auto; border: 1px solid rgba(255,255,255,0.1); }
    button { background: #8b5cf6; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    pre { background: #000; padding: 15px; border-radius: 5px; overflow-x: auto; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Upload Test Image</h2>
    <p>Select an image of a car (like the Swift you showed) to test the Gemini API detection.</p>
    <input type="file" id="imageInput" accept="image/*" />
    <button onclick="uploadImage()">Test Detection</button>
    
    <div id="result" style="display: none; margin-top: 20px;">
      <h3>AI Response:</h3>
      <pre id="jsonResult">Loading...</pre>
    </div>
  </div>

  <script>
    async function uploadImage() {
      const fileInput = document.getElementById('imageInput');
      if (!fileInput.files[0]) return alert("Please select an image first!");
      
      document.getElementById('result').style.display = 'block';
      document.getElementById('jsonResult').innerText = "Analyzing image with Gemini Vision AI...";

      const formData = new FormData();
      formData.append("image", fileInput.files[0]);

      try {
        const response = await fetch("http://localhost:8080/api/upload-cam", {
          method: "POST",
          body: formData
        });
        const data = await response.json();
        document.getElementById('jsonResult').innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById('jsonResult').innerText = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
